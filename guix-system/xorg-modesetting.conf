# xorg-modesetting.conf for GNU/Emacs Operating System (GEOS),
# phase 5c (Xvfb -> Xorg flip).
#
# the goal of this file is to make Xorg pick the modesetting driver
# against /dev/dri/card0, which the linux kernel exposes when the
# virtio_gpu DRM module is loaded against QEMU -vga virtio. this
# bypasses the fbdev/EFI-framebuffer fight that pinned us on Xvfb in
# 5a: virtio-gpu is a real KMS device, FBIOPUT_VSCREENINFO is honored,
# and the modesetting driver does not need any special hardware.
#
# input: AutoAddDevices is OFF and we list explicit InputDevice
# sections. libinput's autoprobe needs a running udevd to push
# hotplug events; we have no udevd by design (no shepherd, per the
# project's hard rules). a static path works because libinput only
# needs libudev to QUERY /sys for the device, which works fine
# against the sysfs we mount in pid1. the event-node numbering below
# assumes the QEMU PS/2 default: kbd at event0, mouse at event1. if
# that ever shifts (extra input devices on the qemu cmdline, virtio-
# input, etc), the symptom is "no keyboard" and the fix is bumping
# these paths.
#
# DPMS: hard off. the host SDL window kept printing "Display output
# is not active" after a minute of idle because Xorg blanked the
# scanout. with all four idle timers zeroed and DPMS=false on the
# monitor, the framebuffer keeps refreshing forever.

Section "ServerFlags"
    Option "AutoAddDevices"     "false"
    Option "AutoEnableDevices"  "false"
    Option "AllowEmptyInput"    "true"
    Option "DontZap"            "false"
    Option "BlankTime"          "0"
    Option "StandbyTime"        "0"
    Option "SuspendTime"        "0"
    Option "OffTime"            "0"
EndSection

Section "Module"
    Load "modesetting"
    Load "evdev"
EndSection

# evdev (xf86-input-evdev) is the older Xorg input driver. unlike
# libinput, it does NOT pull in libudev for device probing; it
# opens the /dev/input/eventN path you give it and reads ioctls
# directly. that is exactly what we want without udevd. trade-off
# is that we lose libinput's gesture/scrolling smoothing, which is
# fine for a vm-only target.
## device numbering verified from pid1's dump_input_devices() output:
##   event0 = ACPI power button (useless)
##   event1 = AT Translated Set 2 keyboard
##   event2+ = mouse (psmouse + usb-tablet, exact node varies; we let
##             Xorg pick it up the first time it actually exists, see
##             AllowEmptyInput below).
## if a future kernel/qemu change shifts the keyboard off event1, the
## fix is: rerun the boot, look at the input: lines on the serial
## console, bump the path here.
Section "InputDevice"
    Identifier  "kbd0"
    Driver      "evdev"
    Option      "Device" "/dev/input/event1"
    Option      "XkbLayout" "us"
EndSection

## mouse: the QEMU usb-tablet (added on the qemu cmdline by both
## emacs-os.sh and dev-vm.sh) shows up as event4 once usbhid is in
## the initrd. it reports ABSOLUTE coordinates, which is exactly
## what we want under a VM: no pointer-grab/release dance, the host
## pointer maps 1:1 into the guest, no "click in the middle of the
## qemu window to capture".
##
## numbering verified from the dump_input_devices output: event0=
## power button, event1=keyboard, event2/3=PS/2 mice (psmouse), event4
## =QEMU QEMU USB Tablet. if a future change to the qemu cmdline
## removes the usb-tablet, point this at event3 (the relative PS/2
## mouse) and drop "Mode" Absolute.
Section "InputDevice"
    Identifier  "mouse0"
    Driver      "evdev"
    Option      "Device" "/dev/input/event4"
    Option      "Mode"   "Absolute"
EndSection

Section "Device"
    Identifier "virtio0"
    Driver     "modesetting"
    Option     "kmsdev"     "/dev/dri/card0"
    Option     "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "qemu-monitor"
    HorizSync   30-80
    VertRefresh 50-75
    Option     "DPMS" "false"
EndSection

Section "Screen"
    Identifier "screen0"
    Device     "virtio0"
    Monitor    "qemu-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        # mode order is preference, first match wins. virtio_gpu happily
        # negotiates whatever the qemu window resizes to, so listing the
        # common host-display sizes from biggest down means: at boot the
        # biggest one fits the qemu gtk window, and as the user resizes
        # the qemu window the X server picks a fitting mode without us
        # having to xrandr by hand. Virtual is set to the largest mode
        # so EXWM has room to honor the host window without truncating.
        # one line on purpose: Xorg's config parser does not honor
        # backslash line continuation (it tokenizes the bare "\" as a
        # keyword and aborts). keep all modes inline.
        Modes "1920x1080" "1680x1050" "1600x900" "1440x900" "1366x768" "1280x800" "1280x720" "1024x768" "800x600"
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "layout0"
    Screen      "screen0"
    InputDevice "kbd0"   "CoreKeyboard"
    InputDevice "mouse0" "CorePointer"
EndSection
