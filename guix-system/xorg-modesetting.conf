# xorg-modesetting.conf for GNU/Emacs OS, phase 5c (Xvfb -> Xorg flip).
#
# the goal of this file is to make Xorg pick the modesetting driver
# against /dev/dri/card0, which the linux kernel exposes when the
# virtio_gpu DRM module is loaded against QEMU -vga virtio. this
# bypasses the fbdev/EFI-framebuffer fight that pinned us on Xvfb in
# 5a: virtio-gpu is a real KMS device, FBIOPUT_VSCREENINFO is honored,
# and the modesetting driver does not need any special hardware.
#
# input: AutoAddDevices=true tells Xorg to open /dev/input/event* via
# the libinput driver, which has a no-udev fallback path that works
# in our setup (we have no eudev/elogind by design). if libinput
# stops finding devices on a future Xorg bump, replace this with
# explicit InputDevice sections pointing at /dev/input/event{0,1}.

Section "ServerFlags"
    Option "AutoAddDevices"     "true"
    Option "AutoEnableDevices"  "true"
    Option "AllowEmptyInput"    "false"
    Option "DontZap"            "false"
EndSection

Section "Module"
    Load "modesetting"
    Load "libinput"
EndSection

Section "Device"
    Identifier "virtio0"
    Driver     "modesetting"
    Option     "kmsdev"     "/dev/dri/card0"
    Option     "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "qemu-monitor"
    HorizSync   30-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "screen0"
    Device     "virtio0"
    Monitor    "qemu-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x768" "800x600"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout0"
    Screen     "screen0"
EndSection
