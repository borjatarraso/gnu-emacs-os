# xorg.conf for GNU/Emacs Operating System (GEOS), phase 5a.
#
# the ONLY job of this file is to make Xorg pick the fbdev driver
# pointed at /dev/fb0, which the linux kernel exposes when QEMU is
# launched with -vga std (vesa-style framebuffer at 1024x768x32).
# without this section, Xorg's autoconfig walks the bus, fails to find
# a modesetting-capable kms driver (we run linux-libre with no extra
# DRM modules loaded by udev because we have no udev), and aborts with
# "no screens found".
#
# fbdev is enough for a phase-5a smoke test: emacs renders into the
# kernel framebuffer, the QEMU GTK display shows it. real DRM/KMS
# (modesetting against bochs-drm or virtio-gpu) is phase 5c.

Section "ServerFlags"
    # without this, Xorg refuses to start without a config file even
    # when -config is on the cmdline.
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowEmptyInput" "true"
EndSection

Section "Device"
    Identifier "fbdev0"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
    Option     "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "qemu-monitor"
    HorizSync   30-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "screen0"
    Device     "fbdev0"
    Monitor    "qemu-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "layout0"
    Screen     "screen0"
EndSection
